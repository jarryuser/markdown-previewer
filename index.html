<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Previewer</title>
  <link rel="icon" href="/favicon.png" sizes="any" />
  <link rel="stylesheet" href="/src/style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    id="hljs-theme"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
  />
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body>
  <header class="toolbar">
    <span class="logo" title="Markdown Previewer">MD</span>
    <div class="toolbar-actions" id="toolbar-actions">
      <div class="tb-group" id="open-dropdown">
        <button id="open-btn" class="tb-btn" title="Open files, folders or save">Open ▾</button>
        <div class="dropdown" id="open-menu">
          <button id="open-file-btn" class="menu-item" title="Open local .md file">Open file…</button>
          <button id="open-dir-btn" class="menu-item" title="Open local directory">Open folder…</button>
          <button id="save-file-btn" class="menu-item" title="Save file (Mod+S)" style="display:none">Save</button>
        </div>
      </div>
      <span class="tb-sep"></span>
      <button id="copy-btn" class="icon-btn" title="Copy Markdown to clipboard">📋</button>
      <button id="find-btn" class="icon-btn" title="Find / Replace (Mod+F)">🔍</button>
      <button id="emoji-btn" class="icon-btn" title="Insert emoji shortcode">😀</button>
      <button id="pdf-btn" class="icon-btn" title="Preview and download as PDF">📄</button>
      <span class="tb-sep"></span>
      <button id="wrap-btn" class="tb-btn" title="Toggle word wrap">Wrap</button>
      <button id="scroll-btn" class="tb-btn" title="Toggle synchronized scrolling">Sync</button>
      <button id="toc-btn" class="tb-btn" title="Table of contents">TOC</button>
      <span class="tb-sep"></span>
      <select id="font-select" title="Document font">
        <option value="system" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">System</option>
        <option value="serif" style="font-family: Georgia, 'Times New Roman', serif">Serif</option>
        <option value="sans" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">Sans</option>
        <option value="mono" style="font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace">Monospace</option>
        <option value="times" style="font-family: 'Times New Roman', Times, serif">Times</option>
        <option value="palatino" style="font-family: Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif">Palatino</option>
        <option value="garamond" style="font-family: Garamond, Cambria, Georgia, serif">Garamond</option>
        <option value="cambria" style="font-family: Cambria, Cochin, Georgia, serif">Cambria</option>
        <option value="arial" style="font-family: Arial, Helvetica, sans-serif">Arial</option>
        <option value="verdana" style="font-family: Verdana, Geneva, Tahoma, sans-serif">Verdana</option>
        <option value="tahoma" style="font-family: Tahoma, Verdana, Geneva, sans-serif">Tahoma</option>
        <option value="trebuchet" style="font-family: 'Trebuchet MS', 'Lucida Grande', 'Segoe UI', sans-serif">Trebuchet</option>
        <option value="courier" style="font-family: 'Courier New', Courier, 'Lucida Console', monospace">Courier</option>
        <option value="impact" style="font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif">Impact</option>
        <option value="comic" style="font-family: 'Comic Sans MS', 'Comic Sans', Chalkboard, cursive">Comic Sans</option>
      </select>
      <button id="font-dec-btn" class="icon-btn" title="Decrease font size">A−</button>
      <button id="font-inc-btn" class="icon-btn" title="Increase font size">A+</button>
      <span class="tb-sep"></span>
      <button id="theme-btn" class="icon-btn" title="Switch color theme">☾</button>
      <div class="tb-group" id="overflow-dropdown">
        <button id="overflow-btn" class="icon-btn" title="More actions">⋯</button>
        <div class="dropdown dropdown-right" id="overflow-menu">
          <button id="clear-btn" class="menu-item" title="Clear editor">Clear</button>
          <button id="export-btn" class="menu-item" title="Export as HTML">Export HTML</button>
          <button id="print-btn" class="menu-item" title="Print">Print</button>
          <span class="menu-sep"></span>
          <span class="menu-label">View</span>
          <button id="wrap-mirror" class="menu-item" title="Toggle word wrap">Word wrap</button>
          <button id="scroll-mirror" class="menu-item" title="Toggle synchronized scrolling">Sync scroll</button>
          <button id="toc-mirror" class="menu-item" title="Table of contents">Table of contents</button>
          <span class="menu-sep"></span>
          <button id="history-btn" class="menu-item" title="Version history">Version history</button>
          <span class="menu-sep"></span>
          <button id="vim-btn" class="menu-item" title="Toggle Vim keybindings">Vim keybindings</button>
          <button id="zen-btn" class="menu-item" title="Zen mode — hide everything but editor and preview">Zen mode</button>
          <button id="fullscreen-btn" class="menu-item" title="Toggle fullscreen">Fullscreen</button>
          <span class="menu-sep"></span>
          <button id="custom-css-btn" class="menu-item" title="Load custom preview CSS">Custom preview CSS…</button>
          <button id="cheatsheet-btn" class="menu-item" title="Keyboard shortcuts (?)">Keyboard shortcuts</button>
          <span class="menu-sep"></span>
          <span class="menu-label">Line font</span>
          <select id="line-font-select" title="Apply font to selected text or the current line">
            <option value="">Line font…</option>
            <option value="remove">Remove font</option>
            <option value="system" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">System</option>
            <option value="serif" style="font-family: Georgia, 'Times New Roman', serif">Serif</option>
            <option value="sans" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">Sans</option>
            <option value="mono" style="font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace">Monospace</option>
            <option value="times" style="font-family: 'Times New Roman', Times, serif">Times</option>
            <option value="palatino" style="font-family: Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif">Palatino</option>
            <option value="garamond" style="font-family: Garamond, Cambria, Georgia, serif">Garamond</option>
            <option value="cambria" style="font-family: Cambria, Cochin, Georgia, serif">Cambria</option>
            <option value="arial" style="font-family: Arial, Helvetica, sans-serif">Arial</option>
            <option value="verdana" style="font-family: Verdana, Geneva, Tahoma, sans-serif">Verdana</option>
            <option value="tahoma" style="font-family: Tahoma, Verdana, Geneva, sans-serif">Tahoma</option>
            <option value="trebuchet" style="font-family: 'Trebuchet MS', 'Lucida Grande', 'Segoe UI', sans-serif">Trebuchet</option>
            <option value="courier" style="font-family: 'Courier New', Courier, 'Lucida Console', monospace">Courier</option>
            <option value="impact" style="font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif">Impact</option>
            <option value="comic" style="font-family: 'Comic Sans MS', 'Comic Sans', Chalkboard, cursive">Comic Sans</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <div id="tab-bar" class="tab-bar">
    <div class="tab-list" id="tab-list">
      <div id="tab-items"></div>
      <button id="new-tab-btn" class="new-tab-btn" title="New tab">+</button>
    </div>
  </div>

  <div id="panes">
    <div id="editor" aria-label="Markdown editor"></div>

    <div id="divider" role="separator" aria-label="Resize panes"></div>

    <div id="preview-pane">
      <div id="preview" class="prose" aria-label="Preview"></div>
      <div id="toc" aria-label="Table of contents"></div>

      <div id="pdf-live" aria-label="PDF preview">
        <div class="pdf-bar">
          <span class="pdf-bar-title">PDF Preview</span>
          <span id="pdf-live-count" class="pdf-live-count"></span>
          <span class="pdf-bar-spacer"></span>
          <button id="pdf-download-btn" class="pdf-download-btn" title="Download PDF">Download</button>
          <button id="pdf-close-btn" class="pdf-close-btn" title="Close">✕</button>
        </div>
        <div id="pdf-live-scroll">
          <div id="pdf-scale-wrap" class="pdf-scale-wrap">
            <div id="pdf-stage" class="pdf-stage"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer id="status-bar" class="status-bar">
    <span id="word-count" class="stat">0 words</span>
    <span id="char-count" class="stat">0 chars</span>
    <span id="reading-time" class="stat"></span>
    <span class="status-spacer"></span>
    <span id="open-file-name" class="stat" style="display:none"></span>
  </footer>

  <!-- canonical A4 sheets for PDF download (offscreen, see style.css) -->
  <div id="pdf-canonical" aria-hidden="true"></div>

  <!-- File System Access: directory overlay -->
  <div id="fsa-overlay" aria-label="Directory viewer">
    <aside id="fsa-sidebar">
      <div class="sidebar-header">
        <span id="fsa-dir-name" class="sidebar-title"></span>
        <button id="fsa-collapse-btn" class="collapse-btn" title="Collapse all">−</button>
        <button id="fsa-close-btn" class="collapse-btn" title="Close folder">✕</button>
      </div>
      <div id="fsa-search-bar">
        <input id="fsa-search-input" type="text" placeholder="Filter files..." autocomplete="off" spellcheck="false" />
      </div>
      <div id="fsa-tree"></div>
    </aside>
    <div id="fsa-sidebar-resize"></div>
    <main id="fsa-content">
      <div id="fsa-nav">
        <button id="fsa-back-btn" class="nav-btn" disabled>←</button>
        <button id="fsa-fwd-btn" class="nav-btn" disabled>→</button>
        <div id="fsa-breadcrumb" class="fsa-breadcrumb"></div>
      </div>
      <div id="fsa-scroll">
        <div class="prose" id="fsa-prose"><p style="color:var(--text-muted)">Select a file from the sidebar</p></div>
      </div>
    </main>
  </div>

  <div id="emoji-backdrop" class="emoji-picker-backdrop"></div>
  <div id="emoji-picker">
    <div class="emoji-picker-header">
      <input id="emoji-search" type="text" placeholder="Search emoji..." autocomplete="off" spellcheck="false" />
      <span id="emoji-count" class="emoji-count"></span>
      <button id="emoji-close-btn">✕</button>
    </div>
    <div id="emoji-grid"></div>
  </div>

  <div id="history-backdrop" class="history-backdrop"></div>
  <div id="history-panel">
    <div class="history-header">
      <span class="history-title">Version History</span>
      <span id="history-count" class="history-count"></span>
      <button id="history-close-btn">✕</button>
    </div>
    <div id="history-list"></div>
  </div>

  <div id="cheatsheet-backdrop" class="cheatsheet-backdrop"></div>
  <div id="cheatsheet-panel">
    <div class="cheatsheet-header">
      <span class="cheatsheet-title">Keyboard Shortcuts</span>
      <button id="cheatsheet-close-btn">✕</button>
    </div>
    <div id="cheatsheet-body"></div>
  </div>

  <input type="file" id="custom-css-input" accept=".css" style="display:none" />

  <button id="zen-exit-btn" title="Exit Zen mode (Esc)">Exit Zen</button>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
